name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore KuangYi.sln
      - name: Build
        run: dotnet build KuangYi.sln -c Release --no-restore
      - name: Self tests
        run: dotnet run --project tests/KuangYi.Tests -c Release --no-build
